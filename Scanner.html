<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMS Registration Compliance Check</title>
  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f4f4f2;
      color: #222;
      margin: 0;
      padding: 20px;
    }

    .tree-card {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #d9d7d1;
      border-radius: 14px;
      box-shadow: 0 18px 50px rgba(30, 30, 30, 0.08);
      overflow: hidden;
    }

    .tree-header {
      padding: 20px 24px;
      border-bottom: 1px solid #ece9e3;
      background: #faf9f7;
    }

    .tree-header h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -0.03em;
    }

    .tree-container {
      padding: 20px 24px;
    }

    .tree-node {
      margin-left: 16px;
      position: relative;
      line-height: 1.5;
    }

    .tree-node::before {
      content: '';
      position: absolute;
      left: -10px;
      top: 14px;
      width: 8px;
      height: 1px;
      background: #ccc;
    }

    .tree-key {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      padding: 4px 0;
    }

    .tree-key:hover {
      color: #1c3f6b;
    }

    .tree-key .arrow {
      display: inline-flex;
      width: 14px;
      height: 14px;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: transform 0.15s ease;
      color: #6a6a6a;
    }

    .tree-key.collapsible .arrow {
      transform: rotate(0deg);
    }

    .tree-key.collapsible.expanded .arrow {
      transform: rotate(90deg);
    }

    .tree-value {
      font-family: 'IBM Plex Mono', monospace;
      color: #444;
      padding: 2px 0 2px 22px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .tree-object,
    .tree-array {
      margin-top: 4px;
      margin-left: 12px;
      border-left: 1px dashed #e0ddd8;
      padding-left: 12px;
      display: none;
    }

    .tree-object.visible,
    .tree-array.visible {
      display: block;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-left: 8px;
    }

    .badge.pass {
      background: #e7f7ef;
      color: #1f6a3d;
    }

    .badge.fail {
      background: #fcebea;
      color: #8b1a1a;
    }
    
    .error-container {
      padding: 20px;
      background: #fdf0f0;
      border: 1px solid #e8c0c0;
      color: #8b1a1a;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <article class="tree-card">
    <header class="tree-header">
      <h1>SMS Registration Compliance Check</h1>
    </header>
    <div class="scan-bar" style="padding:16px 24px; border-bottom:1px solid #ece9e3; background:#fff; display: flex;">
      <input type="text" id="urlInput" placeholder="https://example.com" style="flex:1; padding:8px 12px; font-family: IBM Plex Mono, monospace;" />
      <button id="loadBtn" style="margin-left:12px; padding:8px 12px; font-family: IBM Plex Mono, monospace;" onclick="loadData()">Check</button>
    </div>
    <section class="tree-container" id="treeRoot"></section>
  </article>

  <script>
    const API = window.SCANNER_API_URL || '/scan';

    const excludedKeys = new Set([
      'form_score',
      'form_source',
      'consent_blocks_found',
      'page_text_snapshot',
      'policy_links',
      'consent_text_found'
    ]);

    function createNode(key, value) {
      const node = document.createElement('div');
      node.className = 'tree-node';

      if (value && typeof value === 'object' && !Array.isArray(value)) {
        const header = document.createElement('div');
        header.className = 'tree-key collapsible';
        header.innerHTML = `<span class="arrow">▶</span><strong>${key}</strong>`;
        const childContainer = document.createElement('div');
        childContainer.className = 'tree-object';

        header.addEventListener('click', () => {
          const expanded = childContainer.classList.toggle('visible');
          header.classList.toggle('expanded', expanded);
        });

        for (const childKey of Object.keys(value)) {
          if (excludedKeys.has(childKey)) continue;
          childContainer.appendChild(createNode(childKey, value[childKey]));
        }

        node.append(header, childContainer);
      } else if (Array.isArray(value)) {
        const header = document.createElement('div');
        header.className = 'tree-key collapsible';
        header.innerHTML = `<span class="arrow">▶</span><strong>${key}</strong> [${value.length}]`;
        const childContainer = document.createElement('div');
        childContainer.className = 'tree-array';

        header.addEventListener('click', () => {
          const expanded = childContainer.classList.toggle('visible');
          header.classList.toggle('expanded', expanded);
        });

        value.forEach((item, index) => {
          childContainer.appendChild(createNode(index, item));
        });

        node.append(header, childContainer);
      } else {
        const row = document.createElement('div');
        row.className = 'tree-key';
        const label = document.createElement('span');
        label.innerHTML = `<strong>${key}:</strong>`;
        const valueSpan = document.createElement('span');
        valueSpan.className = 'tree-value';
        valueSpan.textContent = String(value);
        row.append(label, valueSpan);

        if (key === 'pass' && typeof value === 'boolean') {
          const badge = document.createElement('span');
          badge.className = `badge ${value ? 'pass' : 'fail'}`;
          badge.textContent = value ? 'Pass' : 'Fail';
          row.append(badge);
        }

        node.append(row);
      }

      return node;
    }

    function buildDisplayData(source) {
      const displayData = {};

      for (const key of Object.keys(source)) {
        if (excludedKeys.has(key)) continue;
        if (key === 'checks') {
          displayData['Contact Page'] = { ...source.checks };
          continue;
        }
        displayData[key] = source[key];
      }

      return displayData;
    }

    function buildTree(root, source) {
      Object.keys(source).forEach(key => {
        if (excludedKeys.has(key)) return;
        root.appendChild(createNode(key, source[key]));
      });
    }

    const root = document.getElementById('treeRoot');

    function setLoading() {
      root.innerHTML = '<div style="padding:40px;text-align:center;color:#777">Loading…</div>';
    }

    async function loadData() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) return;

      const btn = document.getElementById('loadBtn');
      btn.disabled = true;
      setLoading();

      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        if (!res.ok) {
          // Explicitly check for a 429 Too Many Requests status
          if (res.status === 429) {
            throw new Error("Another job is in progress, please run the check in two minutes.");
          }

          let message = `Server returned ${res.status}`;
          try {
            const err = await res.json();
            if (err.detail) message = err.detail;
          } catch {}
          throw new Error(message);
        }

        const data = await res.json();
        root.innerHTML = '';
        const displayData = buildDisplayData(data);
        buildTree(root, displayData);
      } catch (err) {
        // Safe implementation replacing the missing esc() call with textContent
        root.innerHTML = '';
        const errDiv = document.createElement('div');
        errDiv.className = 'error-container';
        errDiv.textContent = `Error: ${err.message}`;
        root.appendChild(errDiv);
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
